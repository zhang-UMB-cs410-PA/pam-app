name: CI

on:
  push:
  workflow_dispatch:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pam-agent
    steps:
      - uses: actions/checkout@v5
      - id: check
        working-directory: .
        run: echo "present=$([ -f pam-agent/package-lock.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.present == 'true'
        uses: actions/setup-node@v5
        with:
          node-version-file: pam-agent/.nvmrc
          cache: npm
          cache-dependency-path: pam-agent/package-lock.json
      - if: steps.check.outputs.present == 'true'
        run: npm ci
      - if: steps.check.outputs.present == 'true'
        run: for f in *.js; do node --check "$f"; done

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: public.ecr.aws/supabase/postgres:17.12.0.000
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - id: check
        working-directory: .
        run: echo "present=$([ -d backend/tests ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.present == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - if: steps.check.outputs.present == 'true'
        run: pip install -r requirements-dev.txt
      - if: steps.check.outputs.present == 'true'
        run: pytest
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
